<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      border-color: #007bff;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .btn-secondary {
      background-color: #6c757d;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
    }

    /* Esconde a página de resumo por padrão */
    #pagina-resumo {
      display: none;
    }

    .resumo-item {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .resumo-item strong {
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PÁGINA 1: FORMULÁRIO DE CADASTRO -->
    <div id="pagina-cadastro">
      <h2>Cadastro</h2>
      <form id="formCadastro">
        <div class="form-group">
          <label for="nome">Nome Completo *</label>
          <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
          <label for="cpf">CPF (Apenas números - Máx 11 dígitos) *</label>
          <input 
            type="text" 
            id="cpf" 
            name="cpf" 
            maxlength="11" 
            pattern="\d{11}" 
            title="O CPF deve conter exatamente 11 dígitos numéricos."
            required 
            placeholder="Ex: 12345678901"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          >
        </div>

        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
          <label for="telefone">Telefone *</label>
          <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
        </div>

        <button type="submit" class="btn">Cadastrar</button>
      </form>
    </div>

    <!-- PÁGINA 2: CONFIRMAÇÃO / RESUMO DOS DADOS -->
    <div id="pagina-resumo">
      <h2>Dados Cadastrados</h2>
      
      <div class="resumo-item">
        <strong>Nome:</strong> <span id="resumo-nome"></span>
      </div>
      <div class="resumo-item">
        <strong>CPF:</strong> <span id="resumo-cpf"></span>
      </div>
      <div class="resumo-item">
        <strong>E-mail:</strong> <span id="resumo-email"></span>
      </div>
      <div class="resumo-item">
        <strong>Telefone:</strong> <span id="resumo-telefone"></span>
      </div>

      <button id="btnVoltar" class="btn btn-secondary">Voltar</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('formCadastro');
    const cpfInput = document.getElementById('cpf');
    const paginaCadastro = document.getElementById('pagina-cadastro');
    const paginaResumo = document.getElementById('pagina-resumo');
    const btnVoltar = document.getElementById('btnVoltar');

    // Submissão do formulário
    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Impede o recarregamento da página

      // Criticação do CPF (Validação de tamanho exatamente 11 dígitos numéricos)
      const cpfValor = cpfInput.value.trim();
      if (cpfValor.length !== 11) {
        alert('O CPF deve conter exatamente 11 caracteres numéricos!');
        cpfInput.focus();
        return;
      }

      // Preenche a segunda tela com os dados inseridos
      document.getElementById('resumo-nome').textContent = document.getElementById('nome').value;
      document.getElementById('resumo-cpf').textContent = cpfValor.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4"); // Formata para visualização
      document.getElementById('resumo-email').textContent = document.getElementById('email').value;
      document.getElementById('resumo-telefone').textContent = document.getElementById('telefone').value;

      // Alterna o layout das telas
      paginaCadastro.style.display = 'none';
      paginaResumo.style.display = 'block';
    });

    // Botão Voltar
    btnVoltar.addEventListener('click', function() {
      paginaResumo.style.display = 'none';
      paginaCadastro.style.display = 'block';
    });
  </script>

</body>
</html>
